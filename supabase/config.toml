# Supabase CLI configuration for LOCAL development (`supabase start`).
# Hosted projects are configured in the Supabase dashboard; see README → "Configure Supabase".
# Secrets are never written here; `env(...)` reads them from your shell or supabase/.env.

project_id = "woodland-study-tracker"

[api]
enabled = true
port = 54321
# Only `public` is exposed. The `private` schema (role helpers, class-code hash) is not.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Only Sign in with Apple is used. Anonymous, email and phone sign-ups stay off.
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false

[auth.sms]
enable_signup = false

[auth.external.apple]
enabled = true
# Comma-separated list that must include the app's bundle identifier, e.g. org.example.woodland-study
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
# Only needed for the web OAuth flow; the native iOS flow verifies the ID token without it.
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"

[edge_runtime]
enabled = true

[functions.delete-account]
# The function verifies the access token itself with supabase.auth.getUser(), which works
# with both legacy and asymmetric JWT signing keys.
verify_jwt = false
